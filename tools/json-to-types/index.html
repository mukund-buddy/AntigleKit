</head>
<body class="legacy-tool">
  <div data-chrome="header"></div>

  <section class="tool-hero-legacy">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../../">Home</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <a href="../../tools/">Tools</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span aria-current="page">JSON to Types</span>
      </nav>
      <h1 class="section-title">JSON to Types</h1>
      <p class="lead">Paste JSON once and get TypeScript, Python TypedDict, Zod and Go output — inferred, formatted and ready to copy.</p>

      <div class="legacy-actions">
        <button id="btnCopy" class="btn primary" type="button">Copy output</button>
        <button id="btnSample" class="btn" type="button">Load sample</button>
        <button id="btnClear" class="btn ghost" type="button">Clear</button>
      </div>
    </div>
  </section>


  <main class="wrap layout" id="main">
    <noscript>
      <p class="noscript-note"><strong>JSON → Types needs JavaScript.</strong> The inference engine runs entirely in your browser — enable JavaScript to use it.</p>
    </noscript>

    <!-- ============ INPUT ============ -->
    <section class="panel input-pane" aria-label="JSON input">
      <h2 class="panel-h">Input JSON</h2>

      <div class="field">
        <label for="fName">Root type name</label>
        <input id="fName" type="text" value="Root" autocomplete="off" spellcheck="false">
      </div>

      <div class="field grow">
        <label for="fJson">JSON</label>
        <textarea id="fJson" rows="16" spellcheck="false" placeholder='{"id": 1, "name": "Mukund", "tags": ["a","b"], "owner": {"email": "you@example.com"}}'></textarea>
        <span class="count" id="cJson"></span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="alert" id="alert" role="alert" hidden></div>
    </section>

    <!-- ============ OUTPUT ============ -->
    <section class="panel output-pane" aria-label="Generated types">
      <div class="tabs" role="tablist" aria-label="Output language">
        <button role="tab" id="tab-ts" aria-controls="p-ts" aria-selected="true" class="tab active" type="button">TypeScript</button>
        <button role="tab" id="tab-py" aria-controls="p-py" aria-selected="false" class="tab" type="button" tabindex="-1">Python</button>
        <button role="tab" id="tab-zod" aria-controls="p-zod" aria-selected="false" class="tab" type="button" tabindex="-1">Zod</button>
        <button role="tab" id="tab-go" aria-controls="p-go" aria-selected="false" class="tab" type="button" tabindex="-1">Go</button>
      </div>

      <div class="empty" id="empty">
        <p class="empty-mark">{ }</p>
        <p>No JSON yet — paste some on the left, or <button class="linklike" id="btnSample2" type="button">load the sample</button>.</p>
      </div>

      <pre class="code hidden" id="p-ts" role="tabpanel" aria-labelledby="tab-ts" tabindex="0"><code></code></pre>
      <pre class="code hidden" id="p-py" role="tabpanel" aria-labelledby="tab-py" tabindex="0" hidden><code></code></pre>
      <pre class="code hidden" id="p-zod" role="tabpanel" aria-labelledby="tab-zod" tabindex="0" hidden><code></code></pre>
      <pre class="code hidden" id="p-go" role="tabpanel" aria-labelledby="tab-go" tabindex="0" hidden><code></code></pre>
    </section>
  </main>

  <div data-chrome="footer"></div>

  <script src="app.js"></script>
<script src="../../assets/js/chrome.js"></script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/ads.js"></script>
<script src="../../assets/js/main.js"></script>
</body>
</html>
